name: Build ImmortalWrt Firmware (XG-040G-MD)

on:
  workflow_dispatch:      # 手动触发；需要定时编译可取消下面 schedule 的注释
  # schedule:
  #   - cron: '0 20 * * *'
  push:
    branches: [ main ]
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'files/**'

env:
  # === 按你实际使用的源码仓库/分支修改 ===
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 拉取仓库代码（本仓库，含 .config / diy 脚本 / files）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: 初始化编译环境
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            python3-distutils
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt

      - name: 追加自定义 feeds（PassWall / OpenClash / iStore / Lucky / 文件管理）
        run: |
          [ -e $FEEDS_CONF ] && cat $FEEDS_CONF >> openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt && $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 更新 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 载入自定义配置与首次启动脚本
        run: |
          [ -d files ] && mkdir -p openwrt/files && cp -rf files/* openwrt/files/
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt && $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 生成最终 .config（补全依赖）
        run: cd openwrt && make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          echo "$(nproc) 线程编译"
          make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 上传固件到 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-firmware
          path: ${{ env.FIRMWARE }}

      # 如需自动发布到 Releases，取消下面注释，并在仓库 Settings -> Actions ->
      # General -> Workflow permissions 里勾选 "Read and write permissions"
      # - name: 发布到 Releases
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: firmware-${{ github.run_number }}
      #     files: ${{ env.FIRMWARE }}/*
