name: Build ImmortalWrt XG-040G-MD UBI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-openwrt.yml"
      - "diy-part1.sh"
      - "diy-part2.sh"
      - "files/**"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

  # ============================================================
  # ImmortalWrt
  # XG-040G-MD-UBI 目前使用 master
  # ============================================================

  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master

  # ============================================================
  # Target
  # ============================================================

  TARGET: airoha
  SUBTARGET: an7581
  PROFILE: nokia_xg-040g-md-ubi

jobs:

  build:
    name: Build Nokia XG-040G-MD UBI
    runs-on: ubuntu-22.04

    steps:

      # ========================================================
      # 1. Checkout 本项目
      # ========================================================

      - name: Checkout configuration repository
        uses: actions/checkout@v4

      # ========================================================
      # 2. 清理 Runner 磁盘
      # ========================================================

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      # ========================================================
      # 3. 安装编译依赖
      # ========================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo -E apt-get update

          sudo -E apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libusb-1.0-0-dev \
            libelf-dev

          sudo timedatectl set-timezone "$TZ"

      # ========================================================
      # 4. Clone ImmortalWrt master
      # ========================================================

      - name: Clone ImmortalWrt
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          cd openwrt

          echo "=========================================="
          echo "ImmortalWrt commit"
          echo "=========================================="

          git log -1 --oneline

          echo
          echo "=========================================="
          echo "Branch"
          echo "=========================================="

          git branch --show-current

      # ========================================================
      # 5. 确认 XG-040G-MD-UBI target
      # ========================================================

      - name: Verify XG-040G-MD UBI target
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "检查 XG-040G-MD-UBI"
          echo "=========================================="

          if ! grep -R \
            "TARGET_DEVICES += nokia_xg-040g-md-ubi" \
            target/linux/airoha/image
          then
            echo "ERROR: 当前 ImmortalWrt 源码没有 nokia_xg-040g-md-ubi"
            exit 1
          fi

          if ! grep -R \
            "DEVICE_DTS := an7581-nokia_xg-040g-md-ubi" \
            target/linux/airoha/image
          then
            echo "ERROR: 找不到 XG-040G-MD-UBI DTS"
            exit 1
          fi

          echo
          echo "XG-040G-MD-UBI target 检查通过"

      # ========================================================
      # 6. 添加第三方 feeds
      # ========================================================

      - name: Add custom feeds
        run: |
          set -e

          cd openwrt

          chmod +x "$GITHUB_WORKSPACE/diy-part1.sh"

          "$GITHUB_WORKSPACE/diy-part1.sh"

      # ========================================================
      # 7. 更新 feeds
      # ========================================================

      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      # ========================================================
      # 8. 安装 feeds
      # ========================================================

      - name: Install feeds
        run: |
          set -e

          cd openwrt

          ./scripts/feeds install -a

      # ========================================================
      # 9. 生成设备配置
      # ========================================================

      - name: Generate XG-040G-MD UBI config
        run: |
          set -e

          cd openwrt

          rm -f .config

          cat > .config <<'EOF'

          #
          # ============================================================
          # Nokia XG-040G-MD UBI
          # Airoha AN7581
          # ImmortalWrt master
          # ============================================================
          #

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y

          #
          # ============================================================
          # LuCI
          # ============================================================
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y

          #
          # Chinese
          #

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          #
          # ============================================================
          # Argon
          # ============================================================
          #

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          #
          # ============================================================
          # PassWall
          # ============================================================
          #

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y

          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_ipt2socks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          #
          # ============================================================
          # OpenClash
          # ============================================================
          #

          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y

          #
          # ============================================================
          # Tailscale
          # ============================================================
          #

          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-tailscale=y

          #
          # ============================================================
          # Lucky
          # ============================================================
          #

          CONFIG_PACKAGE_luci-app-lucky=y

          #
          # ============================================================
          # File Manager
          # ============================================================
          #

          CONFIG_PACKAGE_luci-app-filemanager=y

          #
          # ============================================================
          # ttyd
          # ============================================================
          #

          CONFIG_PACKAGE_luci-app-ttyd=y

          #
          # ============================================================
          # USB
          # ============================================================
          #

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_usbutils=y

          #
          # ============================================================
          # Filesystem
          # ============================================================
          #

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y

          #
          # ============================================================
          # Network tools
          # ============================================================
          #

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_mtr=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_openssl-util=y

          EOF

          echo
          echo "=========================================="
          echo "执行 make defconfig"
          echo "=========================================="

          make defconfig

      # ========================================================
      # 10. 严格检查最终配置
      # ========================================================

      - name: Verify final configuration
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "TARGET 配置"
          echo "=========================================="

          grep '^CONFIG_TARGET_' .config

          echo
          echo "=========================================="
          echo "检查 XG-040G-MD-UBI"
          echo "=========================================="

          grep \
            '^CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y$' \
            .config

          echo
          echo "=========================================="
          echo "检查关键软件包"
          echo "=========================================="

          grep -E \
            'CONFIG_PACKAGE_(luci|luci-app-passwall|xray-core|sing-box|luci-app-openclash)' \
            .config || true

          echo
          echo "最终配置检查通过"

      # ========================================================
      # 11. 下载源码包
      # ========================================================

      - name: Download package sources
        run: |
          set -e

          cd openwrt

          make download -j8

          find dl -size -1024c -type f -print -delete

      # ========================================================
      # 12. 编译
      # ========================================================

      - name: Compile firmware
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "开始编译"
          echo "=========================================="

          echo "CPU:"
          nproc

          make -j"$(nproc)"

      # ========================================================
      # 13. 检查固件
      # ========================================================

      - name: Verify firmware output
        run: |
          set -e

          cd openwrt

          echo "=========================================="
          echo "固件输出"
          echo "=========================================="

          find bin/targets -type f | sort

          echo
          echo "=========================================="
          echo "检查 sysupgrade.itb"
          echo "=========================================="

          SYSUPGRADE="$(find bin/targets \
            -type f \
            -name '*sysupgrade.itb' \
            | head -n 1)"

          if [ -z "$SYSUPGRADE" ]; then
            echo "ERROR: 没有生成 sysupgrade.itb"
            exit 1
          fi

          echo "FOUND:"
          echo "$SYSUPGRADE"

          echo
          echo "=========================================="
          echo "检查 preloader.bin"
          echo "=========================================="

          PRELOADER="$(find bin/targets \
            -type f \
            -name 'preloader.bin' \
            | head -n 1)"

          if [ -z "$PRELOADER" ]; then
            echo "ERROR: 没有生成 preloader.bin"
            exit 1
          fi

          echo "FOUND:"
          echo "$PRELOADER"

          echo
          echo "=========================================="
          echo "检查 bl31-uboot.fip"
          echo "=========================================="

          FIP="$(find bin/targets \
            -type f \
            -name 'bl31-uboot.fip' \
            | head -n 1)"

          if [ -z "$FIP" ]; then
            echo "ERROR: 没有生成 bl31-uboot.fip"
            exit 1
          fi

          echo "FOUND:"
          echo "$FIP"

          echo
          echo "=========================================="
          echo "全部关键固件文件检查通过"
          echo "=========================================="

      # ========================================================
      # 14. 准备 Artifact
      # ========================================================

      - name: Prepare firmware artifacts
        run: |
          set -e

          cd openwrt/bin/targets

          find . -type d -name packages \
            -prune \
            -exec rm -rf {} +

          echo "=========================================="
          echo "最终文件"
          echo "=========================================="

          find . -type f | sort

      # ========================================================
      # 15. 上传 Artifact
      # ========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: XG-040G-MD-UBI-firmware
          path: openwrt/bin/targets/
          if-no-files-found: error
          retention-days: 30
